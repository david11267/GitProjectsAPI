spring:
  application:
    name: git_projects_api

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://aws-1-eu-north-1.pooler.supabase.com:6543/postgres?user=postgres.${POSTGRES_USERNAME}&password=${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  config:
    import: optional:file:.env[.properties]

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI}
          jwk-set-uri: ${CLERK_JWKS_URI}
