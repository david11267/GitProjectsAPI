version: 1.0
runtime: docker
build:
  # Tell App Runner where your Dockerfile is
  dockerfile: Dockerfile
  context: . # current directory (your backend root)
run:
  # App Runner runs your image with this port
  port: 8080

  # Optional environment variables (you can also set these in the console)
  env:
    SPRING_PROFILES_ACTIVE: "prod"
    JAVA_OPTS: "-Xms512m -Xmx1024m"
    POSTGRES_URL: "${POSTGRES_URL}"
    POSTGRES_USERNAME: "${POSTGRES_USERNAME}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
